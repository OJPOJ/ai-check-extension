<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- AI Content Flag: traffic light motif (red/yellow/green) on the brand indigo from ui.css (--accent).
       The first version with dots including a border blurred into a blob at 16 px; full bars across
       the whole width looked like a national flag. Three touching, strong circles almost fill
       the height (max. area per color -> still recognizable as three colors at 16 px), but leave
       indigo at the left/right and thus look like a traffic light/badge instead of a flag. -->
  <rect width="128" height="128" rx="26" fill="#4f46e5" />
  <circle cx="64" cy="26" r="19" fill="#dc2626" />
  <circle cx="64" cy="64" r="19" fill="#eab308" />
  <circle cx="64" cy="102" r="19" fill="#16a34a" />
</svg>
