<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Content Flag – PDF viewer</title>
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css" />
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
  [hidden] { display: none !important; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg);
    border-bottom: 1px solid var(--border); flex: none; }
  #toolbar > * { flex: none; }
  #toolbar .title { flex: 1 1 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #toolbar button { padding: 6px 14px; white-space: nowrap; }
  #toolbar button.icon { min-width: 34px; padding: 4px 0; font-size: 20px; line-height: 1.2; }
  #toolbar .sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--border); }
  #pageNumber { width: 4em; text-align: center; padding: 6px 4px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
  #stage { display: flex; flex: 1; min-height: 0; }
  #main { position: relative; flex: 1; min-width: 0; }
  #results { flex: none; width: 320px; overflow: auto; background: var(--bg); border-left: 1px solid var(--border);
    padding: 12px; }
  #results h2 { margin-bottom: 8px; }
  #results .counts { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; }
  .chip.red { color: var(--red); border-color: var(--red); }
  .chip.yellow { color: var(--yellow); border-color: var(--yellow); }
  .chip.green { color: var(--green); border-color: var(--green); }
  #toolbar select { width: 9.5em; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); }
  #nextFlagged { margin-bottom: 4px; }
  .confirm { margin: 0 0 10px; padding: 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-text); }
  .confirm p { margin: 6px 0 0; }
  .confirm .row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  /* Marking in the text layer (CSS Custom Highlight API, same look as on web pages: color + line style) */
  ::highlight(aivsai-green) { background-color: rgba(22, 163, 74, 0.18); text-decoration: underline solid rgba(22, 163, 74, 0.8); }
  ::highlight(aivsai-yellow) { background-color: rgba(234, 179, 8, 0.28); text-decoration: underline dashed rgba(161, 98, 7, 0.9); }
  ::highlight(aivsai-red) { background-color: rgba(220, 38, 38, 0.22); text-decoration: underline wavy rgba(220, 38, 38, 0.95); }
  ::highlight(aivsai-uncertain) { background-color: rgba(107, 114, 128, 0.2); text-decoration: underline dashed rgba(107, 114, 128, 0.9); }
  ::highlight(aivsai-focus) { background-color: rgba(59, 130, 246, 0.4); }
  #hits { list-style: none; margin: 8px 0 0; padding: 0; }
  #hits li + li { margin-top: 6px; }
  #hits button { display: block; width: 100%; text-align: left; padding: 6px 8px; }
  #hits .meta { font-weight: 600; font-size: 12px; }
  #hits .meta.red { color: var(--red); }
  #hits .meta.yellow { color: var(--yellow); }
  #hits .meta.green { color: var(--green); }
  #hits .excerpt { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  #viewerContainer { position: absolute; inset: 0; overflow: auto; }
  #notice { max-width: 560px; margin: 48px auto; padding: 20px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; position: relative; }
  #notice h1 { font-size: 16px; margin-bottom: 8px; }
  #notice p { margin: 8px 0 0; }
  #notice .row { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  #dropHint { position: absolute; inset: 12px; display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--accent); border-radius: 12px; background: var(--bg);
    opacity: 0.92; font-size: 16px; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<header id="toolbar">
  <span class="title" id="title">PDF viewer</span>
  <button id="open" type="button">Open file…</button>
  <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
  <span class="sep" aria-hidden="true"></span>
  <button id="prev" type="button" class="icon" aria-label="Previous page" disabled>‹</button>
  <input id="pageNumber" type="number" min="1" value="1" aria-label="Page" disabled />
  <span id="pageCount" class="muted">/ –</span>
  <button id="next" type="button" class="icon" aria-label="Next page" disabled>›</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="zoomOut" type="button" class="icon" aria-label="Zoom out" disabled>−</button>
  <button id="zoomIn" type="button" class="icon" aria-label="Zoom in" disabled>+</button>
  <select id="zoom" aria-label="Zoom" disabled>
    <option value="balanced">Balanced</option>
    <option value="page-width">Fit width</option>
    <option value="page-fit">Fit page</option>
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1">100%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
    <option value="custom" hidden></option>
  </select>
  <span class="sep" aria-hidden="true"></span>
  <button id="scan" type="button" class="primary" disabled>Scan PDF</button>
</header>
<div id="stage">
  <div id="main">
    <div id="viewerContainer" tabindex="0"><div id="viewer" class="pdfViewer"></div></div>
    <div id="notice" hidden>
      <h1 id="noticeTitle"></h1>
      <p id="noticeText"></p>
      <div class="row" id="noticeActions"></div>
    </div>
    <div id="dropHint" hidden>Drop a PDF file to open it</div>
  </div>
  <aside id="results" hidden aria-live="polite">
    <h2>AI check</h2>
    <div id="confirm" class="confirm" hidden role="alertdialog" aria-labelledby="confirmTitle">
      <b id="confirmTitle">Send this PDF's text online?</b>
      <p id="confirmText" class="small"></p>
      <div class="row">
        <button id="confirmSend" type="button" class="primary">Send and check</button>
        <button id="confirmCancel" type="button">Cancel</button>
      </div>
    </div>
    <div id="scanStatus" class="small"></div>
    <div id="scanCounts" class="counts"></div>
    <button id="nextFlagged" type="button" hidden>Next flagged</button>
    <label class="small" id="onlyFlaggedLabel" hidden>
      <input type="checkbox" id="onlyFlagged" /> Only flagged and unclear
    </label>
    <ul id="hits"></ul>
    <p class="small muted" id="scanNotes"></p>
    <button id="stop" type="button" hidden>Stop</button>
  </aside>
</div>

<script src="generated/blocklist.js"></script>
<script src="models.js"></script>
<script src="config.js"></script>
<script src="lang-detect.js"></script>
<script src="manual-check.js"></script>
<script src="content-popover.js"></script>
<script type="module" src="viewer.js"></script>
</body>
</html>
